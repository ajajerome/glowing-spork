name: 🚀 Manual Signing TestFlight

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 📦 Install XcodeGen
      run: brew install xcodegen
        
    - name: 🏗️ Generate Xcode project
      run: |
        cd ios
        xcodegen generate
        echo "✅ Generated files:"
        ls -la
        
    - name: 🔧 Configure for manual signing
      run: |
        cd ios
        
        # Set build number
        BUILD_NUM=$(date +"%y%m%d%H%M")
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Info.plist
        echo "✅ Build number set to: $BUILD_NUM"
        
        # Create a simple signing configuration
        cat > signing.xcconfig << EOF
        DEVELOPMENT_TEAM = MW98Z2Q68W
        PRODUCT_BUNDLE_IDENTIFIER = com.ajagames.learnfotball
        CODE_SIGN_STYLE = Manual
        CODE_SIGN_IDENTITY = iPhone Distribution
        PROVISIONING_PROFILE_SPECIFIER = 
        EOF
        
        echo "✅ Manual signing configuration created"
        
    - name: 🏗️ Build for Simulator (Test compilation)
      run: |
        cd ios
        
        # First test that code compiles for simulator
        xcodebuild \
          -project Fotbollsresan.xcodeproj \
          -scheme Fotbollsresan \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          clean build
          
        echo "✅ Simulator build successful - code compiles correctly!"
        
    - name: 📋 Create manual build instructions
      run: |
        cd ios
        
        echo "🎉 Fotbollsresan kompilerar korrekt!"
        echo ""
        echo "📱 För att bygga för TestFlight manuellt:"
        echo "1. Klona repo på din Mac:"
        echo "   git clone https://github.com/ajajerome/glowing-spork.git"
        echo "   cd glowing-spork/ios"
        echo ""
        echo "2. Generera Xcode projekt:"
        echo "   xcodegen generate"
        echo ""
        echo "3. Öppna i Xcode:"
        echo "   open Fotbollsresan.xcodeproj"
        echo ""
        echo "4. I Xcode:"
        echo "   - Välj ditt Apple Developer Team"
        echo "   - Product → Archive"
        echo "   - Distribute App → App Store Connect"
        echo ""
        echo "✅ Koden är redo för manuell TestFlight upload!"
        
        # Create a downloadable build script
        cat > build_for_testflight.sh << 'EOF'
#!/bin/bash
echo "🚀 Fotbollsresan - Manual TestFlight Build Script"
echo "================================================="

# Check if we're in the right directory
if [ ! -f "project.yml" ]; then
    echo "❌ Please run this script from the ios/ directory"
    exit 1
fi

# Generate Xcode project
echo "🏗️ Generating Xcode project..."
xcodegen generate

if [ $? -eq 0 ]; then
    echo "✅ Xcode project generated successfully!"
    echo ""
    echo "📱 Next steps:"
    echo "1. Open Fotbollsresan.xcodeproj in Xcode"
    echo "2. Select your Apple Developer Team in Signing & Capabilities"
    echo "3. Product → Archive"
    echo "4. Distribute App → App Store Connect → Upload"
    echo ""
    echo "🎉 Ready for manual TestFlight upload!"
    
    # Open Xcode automatically if available
    if command -v open &> /dev/null; then
        echo "🚀 Opening Xcode..."
        open Fotbollsresan.xcodeproj
    fi
else
    echo "❌ Failed to generate Xcode project"
    exit 1
fi
EOF
        
        chmod +x build_for_testflight.sh
        echo "✅ Manual build script created: build_for_testflight.sh"
        
    - name: 📦 Upload build script as artifact
      uses: actions/upload-artifact@v4
      with:
        name: manual-build-script
        path: ios/build_for_testflight.sh