name: 🍎 Apple ID Login TestFlight

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID email'
        required: true
        type: string
      app_password:
        description: 'App-specific password'
        required: true
        type: string

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 📦 Install XcodeGen
      run: brew install xcodegen
        
    - name: 🏗️ Generate Xcode project
      run: |
        cd ios
        xcodegen generate
        echo "✅ Generated TaktikTräning.xcodeproj"
        ls -la TaktikTräning.xcodeproj/
        
    - name: 🔧 Configure build settings
      run: |
        cd ios
        
        # Set build number
        BUILD_NUM=$(date +"%y%m%d%H%M")
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Info.plist
        echo "✅ Build number set to: $BUILD_NUM"
        
    - name: 🍎 Login with Apple ID
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        echo "🍎 Logging in with Apple ID..."
        
        # Create credentials for xcrun altool
        echo "Creating app-specific password file..."
        echo "$APP_PASSWORD" | xcrun altool --store-password-in-keychain-item "AC_PASSWORD" -u "$APPLE_ID" -p @env:APP_PASSWORD
        
        # Verify login works
        echo "🔍 Testing Apple ID authentication..."
        xcrun altool --list-apps -u "$APPLE_ID" -p "@keychain:AC_PASSWORD" --output-format xml
        
        if [ $? -eq 0 ]; then
          echo "✅ Apple ID authentication successful!"
        else
          echo "❌ Apple ID authentication failed"
          exit 1
        fi
        
    - name: 🏗️ Build and Archive
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
      run: |
        cd ios
        
        echo "🏗️ Building TaktikTräning with Apple ID authentication..."
        
        # Build and archive
        xcodebuild \
          -project TaktikTräning.xcodeproj \
          -scheme TaktikTräning \
          -configuration Release \
          -archivePath ./build/TaktikTräning.xcarchive \
          -allowProvisioningUpdates \
          -allowProvisioningDeviceRegistration \
          DEVELOPMENT_TEAM="MW98Z2Q68W" \
          PRODUCT_BUNDLE_IDENTIFIER="com.ajagames.taktiktraning" \
          archive
          
        echo "✅ Archive created successfully!"
        
    - name: 📦 Export for App Store
      run: |
        cd ios
        
        # Create export options
        cat > export_options.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>MW98Z2Q68W</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        # Export archive
        xcodebuild \
          -exportArchive \
          -archivePath ./build/TaktikTräning.xcarchive \
          -exportPath ./build \
          -exportOptionsPlist ./export_options.plist \
          -allowProvisioningUpdates
          
        echo "✅ Export completed!"
        ls -la ./build/
        
    - name: 🚀 Upload to TestFlight
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
      run: |
        cd ios
        
        # Find the IPA file
        IPA_FILE=$(find ./build -name "*.ipa" | head -1)
        if [ -z "$IPA_FILE" ]; then
          echo "❌ No IPA file found"
          ls -la ./build/
          exit 1
        fi
        
        echo "✅ Found IPA: $IPA_FILE"
        
        # Upload using xcrun altool with stored password
        echo "🚀 Uploading to TestFlight..."
        xcrun altool \
          --upload-app \
          --type ios \
          --file "$IPA_FILE" \
          --username "$APPLE_ID" \
          --password "@keychain:AC_PASSWORD"
          
        echo "🎉 Upload to TestFlight completed!"
        
    - name: 🧹 Cleanup
      if: always()
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
      run: |
        cd ios
        # Remove stored password from keychain
        security delete-generic-password -s "AC_PASSWORD" 2>/dev/null || true
        rm -rf build/
        echo "✅ Cleanup completed"