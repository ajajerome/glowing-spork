name: 🍎 Apple ID Login TestFlight

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID email'
        required: true
        type: string
      app_password:
        description: 'App-specific password'
        required: true
        type: string

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 📦 Install XcodeGen
      run: brew install xcodegen
        
    - name: 🏗️ Generate Xcode project
      run: |
        cd ios
        xcodegen generate
        echo "✅ Generated TaktikTräning.xcodeproj"
        ls -la TaktikTräning.xcodeproj/
        
    - name: 🔧 Configure build settings
      run: |
        cd ios
        
        # Set build number
        BUILD_NUM=$(date +"%y%m%d%H%M")
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Info.plist
        echo "✅ Build number set to: $BUILD_NUM"
        
    - name: 🍎 Test Apple ID Authentication
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        echo "🍎 Testing Apple ID authentication..."
        
        # Test authentication directly with app-specific password
        echo "🔍 Testing login with altool..."
        xcrun altool --list-apps -u "$APPLE_ID" -p "$APP_PASSWORD" --output-format xml
        
        if [ $? -eq 0 ]; then
          echo "✅ Apple ID authentication successful!"
        else
          echo "❌ Apple ID authentication failed"
          echo "💡 Make sure you're using an app-specific password, not your regular password"
          exit 1
        fi
        
    - name: 🔧 Setup Xcode Credentials
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        echo "🔧 Setting up Xcode credentials..."
        
        # Try to add Apple ID using xcodebuild with credentials
        # This creates the necessary authentication for provisioning
        echo "🔑 Pre-authenticating with Apple Developer Portal..."
        
        # Create a dummy project to trigger authentication
        mkdir -p temp_auth
        cd temp_auth
        
        # Create minimal project for auth test
        cat > test.xcodeproj/project.pbxproj << 'EOF'
// Minimal project file for authentication test
EOF
        
        # Try to list provisioning profiles to trigger auth
        security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true
        
        cd ../ios
        echo "✅ Credentials setup completed"
        
    - name: 🏗️ Build and Archive
      run: |
        cd ios
        
        echo "🏗️ Building TaktikTräning with logged-in Apple ID..."
        
        # Build and archive (should now have access to Apple ID)
        xcodebuild \
          -project TaktikTräning.xcodeproj \
          -scheme TaktikTräning \
          -configuration Release \
          -archivePath ./build/TaktikTräning.xcarchive \
          -allowProvisioningUpdates \
          -allowProvisioningDeviceRegistration \
          DEVELOPMENT_TEAM="MW98Z2Q68W" \
          PRODUCT_BUNDLE_IDENTIFIER="com.ajagames.taktiktraning" \
          archive
          
        echo "✅ Archive created successfully!"
        
    - name: 📦 Export for App Store
      run: |
        cd ios
        
        # Create export options
        cat > export_options.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>MW98Z2Q68W</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        # Export archive
        xcodebuild \
          -exportArchive \
          -archivePath ./build/TaktikTräning.xcarchive \
          -exportPath ./build \
          -exportOptionsPlist ./export_options.plist \
          -allowProvisioningUpdates
          
        echo "✅ Export completed!"
        ls -la ./build/
        
    - name: 🚀 Upload to TestFlight
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
      run: |
        cd ios
        
        # Find the IPA file
        IPA_FILE=$(find ./build -name "*.ipa" | head -1)
        if [ -z "$IPA_FILE" ]; then
          echo "❌ No IPA file found"
          ls -la ./build/
          exit 1
        fi
        
        echo "✅ Found IPA: $IPA_FILE"
        
        # Upload using xcrun altool with app-specific password
        echo "🚀 Uploading to TestFlight..."
        xcrun altool \
          --upload-app \
          --type ios \
          --file "$IPA_FILE" \
          --username "$APPLE_ID" \
          --password "${{ github.event.inputs.app_password }}"
          
        echo "🎉 Upload to TestFlight completed!"
        
    - name: 🧹 Cleanup
      if: always()
      run: |
        cd ios
        rm -rf build/
        echo "✅ Cleanup completed"