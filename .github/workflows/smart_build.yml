name: 🧠 Smart Build - Auto Apple ID Login

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID email (if login required)'
        required: false
        type: string
      app_password:
        description: 'App-specific password (if login required)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 📦 Install dependencies
      run: |
        brew install xcodegen
        brew install expect
        
    - name: 🏗️ Generate Xcode project
      run: |
        cd ios
        xcodegen generate
        echo "✅ Generated TaktikTräning.xcodeproj"
        
    - name: 🔧 Configure build settings
      run: |
        cd ios
        BUILD_NUM=$(date +"%y%m%d%H%M")
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Info.plist
        echo "✅ Build number set to: $BUILD_NUM"
        
    - name: 🎯 Smart Build with Auto Login
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        cd ios
        
        echo "🧠 Starting smart build process..."
        
        # Create expect script that handles Apple ID login when prompted
        cat > auto_login.exp << 'EOF'
#!/usr/bin/expect -f

set timeout 120
set apple_id [lindex $argv 0]
set password [lindex $argv 1]

puts "🔐 Starting xcodebuild with auto-login capability..."

# Start xcodebuild archive command
spawn xcodebuild -project TaktikTräning.xcodeproj -scheme TaktikTräning -configuration Release -archivePath ./build/TaktikTräning.xcarchive -allowProvisioningUpdates -allowProvisioningDeviceRegistration DEVELOPMENT_TEAM=MW98Z2Q68W PRODUCT_BUNDLE_IDENTIFIER=com.ajagames.taktiktraning archive

expect {
    "Apple ID:" {
        puts "🍎 Apple ID prompt detected - entering credentials..."
        send "$apple_id\r"
        exp_continue
    }
    "Password:" {
        puts "🔑 Password prompt detected - entering app-specific password..."
        send "$password\r"
        exp_continue
    }
    "Enter your password:" {
        puts "🔑 Alternative password prompt detected..."
        send "$password\r"
        exp_continue
    }
    "Two-factor authentication" {
        puts "📱 2FA prompt detected - app-specific password should bypass this..."
        send "\r"
        exp_continue
    }
    "Continue" {
        puts "➡️ Continue prompt detected..."
        send "\r"
        exp_continue
    }
    "Sign In" {
        puts "✅ Sign In prompt detected..."
        send "\r"
        exp_continue
    }
    "** ARCHIVE SUCCEEDED **" {
        puts "🎉 Archive succeeded!"
        exit 0
    }
    "** ARCHIVE FAILED **" {
        puts "❌ Archive failed"
        exit 1
    }
    "** BUILD SUCCEEDED **" {
        puts "✅ Build succeeded, continuing..."
        exp_continue
    }
    eof {
        puts "📋 Build process completed"
        exit 0
    }
    timeout {
        puts "⏰ Timeout - build taking longer than expected"
        exit 1
    }
}
EOF
        
        chmod +x auto_login.exp
        
        # Run the smart build with auto-login
        if [ -n "$APPLE_ID" ] && [ -n "$APP_PASSWORD" ]; then
          echo "🔐 Running with Apple ID credentials provided"
          ./auto_login.exp "$APPLE_ID" "$APP_PASSWORD"
        else
          echo "🤔 No Apple ID provided - trying build without authentication first..."
          
          # Try build without auth first
          xcodebuild \
            -project TaktikTräning.xcodeproj \
            -scheme TaktikTräning \
            -configuration Release \
            -archivePath ./build/TaktikTräning.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            DEVELOPMENT_TEAM="MW98Z2Q68W" \
            PRODUCT_BUNDLE_IDENTIFIER="com.ajagames.taktiktraning" \
            archive
            
          if [ $? -ne 0 ]; then
            echo "❌ Build failed without authentication"
            echo "💡 Re-run workflow with Apple ID and app-specific password"
            exit 1
          fi
        fi
        
        echo "✅ Archive created successfully!"
        
    - name: 📦 Export for App Store
      run: |
        cd ios
        
        # Verify archive exists
        if [ ! -d "./build/TaktikTräning.xcarchive" ]; then
          echo "❌ Archive not found"
          ls -la ./build/
          exit 1
        fi
        
        # Create export options
        cat > export_options.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>MW98Z2Q68W</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        # Export archive
        xcodebuild \
          -exportArchive \
          -archivePath ./build/TaktikTräning.xcarchive \
          -exportPath ./build \
          -exportOptionsPlist ./export_options.plist \
          -allowProvisioningUpdates
          
        echo "✅ Export completed!"
        ls -la ./build/
        
    - name: 🚀 Upload to TestFlight
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        cd ios
        
        # Find IPA file
        IPA_FILE=$(find ./build -name "*.ipa" | head -1)
        if [ -z "$IPA_FILE" ]; then
          echo "❌ No IPA file found"
          ls -la ./build/
          exit 1
        fi
        
        echo "✅ Found IPA: $IPA_FILE"
        
        # Upload to TestFlight
        if [ -n "$APPLE_ID" ] && [ -n "$APP_PASSWORD" ]; then
          echo "🚀 Uploading to TestFlight with provided credentials..."
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --username "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --verbose
            
          if [ $? -eq 0 ]; then
            echo "🎉🎉🎉 TaktikTräning uploaded to TestFlight successfully!"
            echo "📱 Check TestFlight app on your iPhone in 5-10 minutes!"
          else
            echo "❌ Upload failed - check credentials"
            exit 1
          fi
        else
          echo "❌ No Apple ID credentials provided for upload"
          echo "💡 Re-run workflow with Apple ID and app-specific password"
          echo "📦 Or download IPA from artifacts for manual upload"
          exit 1
        fi
        
    - name: 📦 Upload IPA as backup
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: taktiktraning-ipa-backup
        path: ios/build/*.ipa
        retention-days: 7