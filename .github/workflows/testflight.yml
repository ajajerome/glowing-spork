name: 🚀 Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type'
        required: true
        default: 'beta'
        type: choice
        options:
        - beta
        - release

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 🔍 Verify Xcode setup
      run: |
        echo "=== Xcode version ==="
        xcodebuild -version
        echo "=== Available Xcode versions ==="
        ls -la /Applications/ | grep Xcode
        echo "=== Current Xcode path ==="
        xcode-select -p
        
    - name: 📦 Install dependencies
      run: |
        brew install xcodegen fastlane
        
    - name: 🏗️ Generate Xcode project
      run: |
        cd ios
        echo "=== Before XcodeGen ==="
        ls -la
        
        xcodegen generate
        
        echo "=== After XcodeGen ==="
        ls -la
        echo "=== All Xcode files ==="
        find . -name "*.xcworkspace" -o -name "*.xcodeproj"
        echo "=== Project.yml contents ==="
        cat project.yml
        
        # Verify the expected project exists
        if [ -f "Fotbollsresan.xcodeproj/project.pbxproj" ]; then
          echo "✅ Fotbollsresan.xcodeproj found!"
        else
          echo "❌ Fotbollsresan.xcodeproj NOT found!"
          echo "Available files:"
          find . -name "*.xcodeproj"
        fi
        
    - name: 🔑 Setup App Store Connect API
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      run: |
        echo "API keys configured"
        
    - name: 🔍 Debug Fastlane setup
      run: |
        echo "=== Current directory ==="
        pwd
        ls -la
        echo "=== Fastlane directory ==="
        ls -la fastlane/
        echo "=== iOS directory ==="
        ls -la ios/
        echo "=== Looking for Xcode files ==="
        find . -name "*.xcodeproj" -o -name "*.xcworkspace"
        
    - name: 🚀 Deploy to TestFlight
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
        FASTLANE_XCODE_LIST_TIMEOUT: 120
      run: |
        # Set non-interactive mode
        export FASTLANE_SKIP_UPDATE_CHECK=1
        export FASTLANE_HIDE_CHANGELOG=1
        export CI=true
        
        # Run fastlane from root directory where fastlane folder exists
        if [ "${{ github.event.inputs.version_type }}" = "release" ]; then
          fastlane ios release --verbose
        else
          fastlane ios beta --verbose
        fi
        
    - name: 📊 Upload build artifacts
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          ios/fastlane/report.xml
          ios/build/logs/