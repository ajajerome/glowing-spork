name: 🔐 Auto Sign-In TestFlight Deploy

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID email'
        required: true
        type: string
      app_password:
        description: 'App-specific password'
        required: true
        type: string

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 📦 Install dependencies
      run: |
        brew install xcodegen
        # Install expect for automated interaction
        brew install expect
        
    - name: 🏗️ Generate Xcode project
      run: |
        cd ios
        xcodegen generate
        echo "✅ Generated TaktikTräning.xcodeproj"
        
    - name: 🔧 Configure build settings
      run: |
        cd ios
        BUILD_NUM=$(date +"%y%m%d%H%M")
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Info.plist
        echo "✅ Build number set to: $BUILD_NUM"
        
    - name: 🔐 Automated Apple ID Sign-In
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        echo "🔐 Setting up automated Apple ID sign-in..."
        
        # Create expect script for automated sign-in
        cat > signin.exp << 'EOF'
#!/usr/bin/expect -f

set timeout 30
set apple_id [lindex $argv 0]
set password [lindex $argv 1]

# Start xcodebuild with interactive provisioning
spawn xcodebuild -project TaktikTräning.xcodeproj -scheme TaktikTräning -showBuildSettings

# Look for Apple ID prompt
expect {
    "Apple ID:" {
        send "$apple_id\r"
        exp_continue
    }
    "Password:" {
        send "$password\r"
        exp_continue
    }
    "Two-factor authentication" {
        # Handle 2FA if needed
        send "\r"
        exp_continue
    }
    eof {
        exit 0
    }
    timeout {
        puts "Timeout waiting for prompts"
        exit 1
    }
}
EOF
        
        chmod +x signin.exp
        
        # Try to trigger Apple ID prompt and handle it
        cd ios
        echo "🔑 Attempting automated sign-in..."
        
        # Use expect script to handle interactive prompts
        expect signin.exp "$APPLE_ID" "$APP_PASSWORD" || echo "Sign-in attempt completed"
        
        echo "✅ Sign-in process completed"
        
    - name: 🏗️ Build with Pre-Authentication
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        cd ios
        
        echo "🏗️ Building with pre-authenticated session..."
        
        # Set environment variables for xcodebuild
        export XCODE_XCCONFIG_FILE=""
        export FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD="$APP_PASSWORD"
        export FASTLANE_USER="$APPLE_ID"
        
        # Build and archive
        xcodebuild \
          -project TaktikTräning.xcodeproj \
          -scheme TaktikTräning \
          -configuration Release \
          -archivePath ./build/TaktikTräning.xcarchive \
          -allowProvisioningUpdates \
          -allowProvisioningDeviceRegistration \
          DEVELOPMENT_TEAM="MW98Z2Q68W" \
          PRODUCT_BUNDLE_IDENTIFIER="com.ajagames.taktiktraning" \
          archive
          
        echo "✅ Archive created successfully!"
        
    - name: 📦 Export for App Store
      run: |
        cd ios
        
        # Create export options
        cat > export_options.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>MW98Z2Q68W</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        # Export archive
        xcodebuild \
          -exportArchive \
          -archivePath ./build/TaktikTräning.xcarchive \
          -exportPath ./build \
          -exportOptionsPlist ./export_options.plist \
          -allowProvisioningUpdates
          
        echo "✅ Export completed!"
        
    - name: 🚀 Upload to TestFlight
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        cd ios
        
        # Find IPA file
        IPA_FILE=$(find ./build -name "*.ipa" | head -1)
        if [ -z "$IPA_FILE" ]; then
          echo "❌ No IPA file found"
          exit 1
        fi
        
        echo "✅ Found IPA: $IPA_FILE"
        
        # Upload to TestFlight
        echo "🚀 Uploading to TestFlight..."
        xcrun altool \
          --upload-app \
          --type ios \
          --file "$IPA_FILE" \
          --username "$APPLE_ID" \
          --password "$APP_PASSWORD" \
          --verbose
          
        echo "🎉 TaktikTräning uploaded to TestFlight successfully!"
        
    - name: 🎉 Success Message
      run: |
        echo "🎉🎉🎉 FRAMGÅNG! TaktikTräning är nu på väg till TestFlight!"
        echo ""
        echo "📱 Nästa steg:"
        echo "1. Vänta 5-10 minuter på TestFlight processing"
        echo "2. Öppna TestFlight-appen på din iPhone"
        echo "3. TaktikTräning dyker upp under 'Apps Available to Test'"
        echo "4. Installera och testa alla SpelSmart-funktioner!"
        echo ""
        echo "🎮 Funktioner att testa:"
        echo "- Interaktiva fotbollsscenarier med beslutspunkter"
        echo "- XP-system och level-ups"
        echo "- Badge-system och achievements"
        echo "- Dagliga utmaningar och streaks"
        echo "- Skill radar och progression"
        echo "- Coach-läge för avancerad analys"
        echo ""
        echo "⚽ Lycka till med testningen av TaktikTräning!"