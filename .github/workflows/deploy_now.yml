name: Deploy TaktikTraning Now

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID email'
        required: true
      app_password:
        description: 'App-specific password'
        required: true

jobs:
  deploy:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install tools
      run: |
        brew install xcodegen
        brew install expect
        
    - name: Generate project
      run: |
        cd ios
        xcodegen generate
        
    - name: Build with expect
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        cd ios
        
        # Simple expect script
        expect << EXPECTEND
        set timeout 300
        spawn xcodebuild -project TaktikTräning.xcodeproj -scheme TaktikTräning -configuration Release -archivePath ./build/TaktikTräning.xcarchive -allowProvisioningUpdates -allowProvisioningDeviceRegistration DEVELOPMENT_TEAM=MW98Z2Q68W PRODUCT_BUNDLE_IDENTIFIER=com.ajagames.taktiktraning archive
        
        expect {
          "Apple ID:" {
            send "$env(APPLE_ID)\\r"
            exp_continue
          }
          "Password:" {
            send "$env(APP_PASSWORD)\\r"
            exp_continue
          }
          "ARCHIVE SUCCEEDED" {
            exit 0
          }
          "ARCHIVE FAILED" {
            exit 1
          }
          eof {
            exit 0
          }
          timeout {
            exit 1
          }
        }
        EXPECTEND
        
    - name: Export and upload
      env:
        APPLE_ID: ${{ github.event.inputs.apple_id }}
        APP_PASSWORD: ${{ github.event.inputs.app_password }}
      run: |
        cd ios
        
        # Export
        cat > export.plist << PLISTEND
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store</string>
          <key>teamID</key>
          <string>MW98Z2Q68W</string>
        </dict>
        </plist>
        PLISTEND
        
        xcodebuild -exportArchive -archivePath ./build/TaktikTräning.xcarchive -exportPath ./build -exportOptionsPlist ./export.plist
        
        # Upload
        IPA_FILE=$(find ./build -name "*.ipa" | head -1)
        xcrun altool --upload-app --type ios --file "$IPA_FILE" --username "$APPLE_ID" --password "$APP_PASSWORD"
        
        echo "SUCCESS: TaktikTräning uploaded to TestFlight!"