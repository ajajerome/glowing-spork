name: 🚀 Simple TestFlight Deploy

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 📦 Install XcodeGen
      run: brew install xcodegen
        
    - name: 🏗️ Generate Xcode project
      run: |
        cd ios
        xcodegen generate
        echo "✅ Generated files:"
        ls -la
        
    - name: 🔧 Configure project for App Store
      run: |
        cd ios
        
        # Set build number
        BUILD_NUM="${{ github.event.inputs.build_number }}"
        if [ -z "$BUILD_NUM" ]; then
          BUILD_NUM=$(date +"%y%m%d%H%M")
        fi
        
        # Update build settings using PlistBuddy
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Info.plist
        
        echo "✅ Build number set to: $BUILD_NUM"
        
    - name: 🏗️ Build for App Store
      run: |
        cd ios
        
        # Build and archive
        xcodebuild \
          -project Fotbollsresan.xcodeproj \
          -scheme Fotbollsresan \
          -configuration Release \
          -archivePath ./build/Fotbollsresan.xcarchive \
          -allowProvisioningUpdates \
          -allowProvisioningDeviceRegistration \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          DEVELOPMENT_TEAM="MW98Z2Q68W" \
          PRODUCT_BUNDLE_IDENTIFIER="com.ajagames.learnfotball" \
          archive
          
    - name: 📦 Export for App Store
      run: |
        cd ios
        
        # Create export options
        cat > export_options.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>MW98Z2Q68W</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        # Export archive
        xcodebuild \
          -exportArchive \
          -archivePath ./build/Fotbollsresan.xcarchive \
          -exportPath ./build \
          -exportOptionsPlist ./export_options.plist \
          -allowProvisioningUpdates
          
    - name: 🚀 Upload to TestFlight
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      run: |
        cd ios
        
        # Find the IPA file
        IPA_FILE=$(find ./build -name "*.ipa" | head -1)
        if [ -z "$IPA_FILE" ]; then
          echo "❌ No IPA file found"
          ls -la ./build/
          exit 1
        fi
        
        echo "✅ Found IPA: $IPA_FILE"
        
        # Create API key file
        echo "$ASC_API_KEY_P8" > api_key.p8
        
        # Upload using xcrun altool
        xcrun altool \
          --upload-app \
          --type ios \
          --file "$IPA_FILE" \
          --apiKey "$ASC_KEY_ID" \
          --apiIssuer "$ASC_ISSUER_ID" \
          --apiKeyFile ./api_key.p8
          
        echo "🎉 Upload to TestFlight completed!"
        
    - name: 🧹 Cleanup
      if: always()
      run: |
        cd ios
        rm -f api_key.p8
        rm -rf build/