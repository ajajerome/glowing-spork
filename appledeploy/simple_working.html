<!DOCTYPE html>
<html>
<head>
    <title>AppleDeploy - Simple Working Version</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, button {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #0056CC;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍎 AppleDeploy</h1>
        <p>Simple Working Version - Zip to TestFlight</p>
        
        <form id="deploy-form" enctype="multipart/form-data">
            <div class="form-group">
                <label>📦 Select iOS Project ZIP:</label>
                <input type="file" id="project-file" name="project_file" accept=".zip,.xcarchive" required>
            </div>
            
            <div class="form-group">
                <label>📧 Apple ID:</label>
                <input type="email" id="apple-id" name="apple_id" value="jeromenilssonaja@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label>🔑 App-Specific Password:</label>
                <input type="password" id="app-password" name="app_password" placeholder="xxxx-xxxx-xxxx-xxxx" required>
                <small>Create at <a href="https://appleid.apple.com" target="_blank">appleid.apple.com</a> → Security</small>
            </div>
            
            <button type="submit" id="deploy-btn">🚀 Deploy to TestFlight</button>
        </form>
        
        <div class="status" id="status">
            <div id="status-message"></div>
        </div>
        
        <div class="status info" id="logs" style="font-family: monospace; font-size: 14px;">
            <div id="log-content"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('deploy-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            console.log('🚀 Deploy form submitted');
            
            const formData = new FormData(this);
            const statusDiv = document.getElementById('status');
            const statusMessage = document.getElementById('status-message');
            const logsDiv = document.getElementById('logs');
            const logContent = document.getElementById('log-content');
            
            // Show status
            statusDiv.className = 'status info show';
            statusMessage.textContent = '🚀 Starting deployment to Mac server...';
            
            logsDiv.classList.add('show');
            logContent.innerHTML = '[' + new Date().toLocaleTimeString() + '] 🚀 Sending to Mac server...<br>';
            
            // Disable button
            document.getElementById('deploy-btn').disabled = true;
            document.getElementById('deploy-btn').textContent = '🔄 Deploying...';
            
            console.log('📤 Sending POST to /api/deploy/live');
            
            fetch('/api/deploy/live', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                console.log('📨 Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('📋 Response data:', data);
                
                if (data.deployment_id) {
                    statusMessage.textContent = '✅ Deployment started: ' + data.deployment_id;
                    logContent.innerHTML += '[' + new Date().toLocaleTimeString() + '] ✅ Deployment ID: ' + data.deployment_id + '<br>';
                    
                    // Monitor progress
                    monitorDeployment(data.deployment_id);
                } else {
                    statusDiv.className = 'status error show';
                    statusMessage.textContent = '❌ Failed to start deployment';
                    logContent.innerHTML += '[' + new Date().toLocaleTimeString() + '] ❌ Error: ' + JSON.stringify(data) + '<br>';
                }
            })
            .catch(error => {
                console.error('❌ Fetch error:', error);
                statusDiv.className = 'status error show';
                statusMessage.textContent = '❌ Connection error: ' + error;
                logContent.innerHTML += '[' + new Date().toLocaleTimeString() + '] ❌ Connection error: ' + error + '<br>';
            })
            .finally(() => {
                // Re-enable button
                document.getElementById('deploy-btn').disabled = false;
                document.getElementById('deploy-btn').textContent = '🚀 Deploy to TestFlight';
            });
        });
        
        function monitorDeployment(deploymentId) {
            console.log('📊 Monitoring deployment:', deploymentId);
            
            function checkStatus() {
                fetch(`/api/deployment/${deploymentId}/live-status`)
                .then(response => response.json())
                .then(data => {
                    console.log('📋 Status data:', data);
                    
                    // Add new logs
                    if (data.logs) {
                        data.logs.forEach(log => {
                            const time = new Date(log.timestamp).toLocaleTimeString();
                            const logContent = document.getElementById('log-content');
                            logContent.innerHTML += `[${time}] ${log.message}<br>`;
                            logsDiv.scrollTop = logsDiv.scrollHeight;
                        });
                    }
                    
                    // Check completion
                    if (data.status === 'completed') {
                        document.getElementById('status').className = 'status success show';
                        document.getElementById('status-message').textContent = '🎉 SUCCESS! App deployed to TestFlight!';
                        alert('🎉 SUCCESS!\n\nYour app is now in TestFlight!\nCheck the TestFlight app on your iPhone!');
                    } else if (data.status === 'failed') {
                        document.getElementById('status').className = 'status error show';
                        document.getElementById('status-message').textContent = '❌ Deployment failed';
                    } else {
                        // Continue monitoring
                        setTimeout(checkStatus, 2000);
                    }
                })
                .catch(error => {
                    console.error('Status check error:', error);
                    setTimeout(checkStatus, 5000);
                });
            }
            
            checkStatus();
        }
    </script>
</body>
</html>
